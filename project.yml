name: DataMeter
options:
  bundleIdPrefix: com.datameter
  deploymentTarget:
    iOS: "17.0"
targets:
  DataMeter:
    type: application
    platform: iOS
    sources: [DataMeter]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: عداد الاستهلاك
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.datameter.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datameter.egypt26
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
